spring.application.name=MiniPay

spring.datasource.url=jdbc:postgresql://localhost:15432/minipay
spring.datasource.username=minipay
spring.datasource.password=minipay

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.include-message=always

minipay.security.username=minipay
minipay.security.password=minipay

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
